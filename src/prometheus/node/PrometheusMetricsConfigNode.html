<script type="text/markdown" template-section="onIncludeDocumentation">
### Prometheus Metrics Config
Configures a Prometheus metrics scrape endpoint. A Prometheus server can scrape this endpoint to collect metrics.

: *name* (string) : A descriptive name for this metrics provider.
: *path* (string) : The HTTP path Prometheus will scrape (configured via the Webhook section).
: *port* (number) : The port the scrape endpoint listens on (configured via the Webhook section).
